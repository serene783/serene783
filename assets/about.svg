<svg width="680" height="260" viewBox="0 0 680 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 24px; fill: #FFFFFF; }
      .pill-text { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 15.5px; fill: #E6EDF3; }
      .pill-text-multiline { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 500; font-size: 14px; fill: #E6EDF3; }
      .pill-bg { fill: #161B22; stroke: #30363D; stroke-width: 1; transition: 0.3s; }
      .pill-bg:hover { fill: #1C2128; stroke: #8B949E; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="678" height="258" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Flower Scalloped Icon Badge -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(0 18 18)"/>
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(30 18 18)"/>
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(60 18 18)"/>
    
    <!-- Perfectly Centered Heart Icon (Center at 18, 18) -->
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(10, 9.9) scale(0.67)" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="74" y="46" class="title">About me</text>

  <!-- Pill 1: 20 yo. developer -->
  <g transform="translate(24, 74)">
    <rect class="pill-bg" width="632" height="42" rx="21"/>
    <!-- Icon Circle -->
    <circle cx="24" cy="21" r="14" fill="#21262D"/>
    <!-- User Icon -->
    <path d="M24 18c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V25h14v-1.5c0-2.33-4.67-3.5-7-3.5z" fill="#FFFFFF"/>
    <text x="48" y="26" class="pill-text">developer-student</text>
  </g>

  <!-- Pill 2: Development in Flutter, Rust, Java and web stacks, AI agents and routine automation, IT project management, home server. -->
  <g transform="translate(24, 126)">
    <rect class="pill-bg" width="632" height="56" rx="20"/>
    <!-- Icon Circle -->
    <circle cx="24" cy="28" r="14" fill="#21262D"/>
    <!-- Code Bracket Icon -->
    <path d="M21 24l-3.5 4 3.5 4-1.2 1.4-4.8-5.4 4.8-5.4L21 24zm6 0l3.5 4-3.5 4 1.2 1.4 4.8-5.4-4.8-5.4L27 24z" fill="#FFFFFF"/>
    <text x="48" y="23" class="pill-text-multiline">Development in Flutter, Rust, Java and web stacks, AI agents and routine automation,</text>
    <text x="48" y="43" class="pill-text-multiline">IT project management, home server.</text>
  </g>

  <!-- Pill 3: Web, frontend and UI design -->
  <g transform="translate(24, 192)">
    <rect class="pill-bg" width="632" height="42" rx="21"/>
    <!-- Icon Circle -->
    <circle cx="24" cy="21" r="14" fill="#21262D"/>
    <!-- Palette Icon -->
    <path d="M24 13c-4.42 0-8 3.58-8 8s3.58 8 8 8c.55 0 1-.45 1-1 0-.25-.09-.47-.25-.65-.16-.18-.25-.41-.25-.65 0-.55.45-1 1-1h1.5c2.76 0 5-2.24 5-5 0-4.42-3.58-7.7-8-7.7zm-4.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3 3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="#FFFFFF"/>
    <text x="48" y="26" class="pill-text">Web, frontend and UI design</text>
  </g>
</svg>

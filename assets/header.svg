<svg width="100%" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-450px); }
      }
      @keyframes waveFlowSlow {
        0% { transform: translateX(-450px); }
        100% { transform: translateX(0); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes textGlow {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(255,255,255,0.2)); }
        50% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
      }
      .header-title {
        font-family: 'Centaur', 'EB Garamond', Georgia, serif;
        font-size: 52px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 4px;
        text-anchor: middle;
        animation: textGlow 4s ease-in-out infinite;
      }
      .header-desc {
        font-family: 'Centaur', 'EB Garamond', Georgia, serif;
        font-size: 17px;
        font-weight: 500;
        fill: #8B949E;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .wave-layer-back {
        animation: waveFlow 18s linear infinite;
      }
      .wave-layer-front {
        animation: waveFlowSlow 12s linear infinite;
      }
      .star1 { animation: twinkle 3s ease-in-out infinite; transform-origin: 210px 50px; }
      .star2 { animation: twinkle 4s ease-in-out 1s infinite; transform-origin: 260px 90px; }
      .star3 { animation: twinkle 3.5s ease-in-out 0.5s infinite; transform-origin: 680px 45px; }
      .star4 { animation: twinkle 4.5s ease-in-out 2s infinite; transform-origin: 720px 85px; }
    </style>
    <linearGradient id="waveGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161C"/>
      <stop offset="50%" stop-color="#090B0E"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <linearGradient id="waveGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2128"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>

  <!-- Animated Background Wave (Deeper layer) -->
  <g class="wave-layer-back">
    <path d="M0 0 H1800 V125 Q1687.5 155 1575 130 Q1462.5 105 1350 130 Q1237.5 155 1125 130 Q1012.5 105 900 130 Q787.5 155 675 130 Q562.5 105 450 130 Q337.5 155 225 130 Q112.5 105 0 130 Z" fill="url(#waveGradBack)"/>
    <path d="M0 0 H1800 V125 Q1687.5 155 1575 130 Q1462.5 105 1350 130 Q1237.5 155 1125 130 Q1012.5 105 900 130 Q787.5 155 675 130 Q562.5 105 450 130 Q337.5 155 225 130 Q112.5 105 0 130 Z" stroke="#21262D" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Animated Foreground Wave (Primary wave) -->
  <g class="wave-layer-front">
    <path d="M0 0 H1800 V140 Q1687.5 115 1575 140 Q1462.5 165 1350 140 Q1237.5 115 1125 140 Q1012.5 165 900 140 Q787.5 115 675 140 Q562.5 165 450 140 Q337.5 115 225 140 Q112.5 165 0 140 Z" fill="url(#waveGradFront)" fill-opacity="0.9"/>
    <path d="M0 0 H1800 V140 Q1687.5 115 1575 140 Q1462.5 165 1350 140 Q1237.5 115 1125 140 Q1012.5 165 900 140 Q787.5 115 675 140 Q562.5 165 450 140 Q337.5 115 225 140 Q112.5 165 0 140 Z" stroke="#30363D" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Twinkling Accent Stars -->
  <circle class="star1" cx="210" cy="50" r="1.5" fill="#FFFFFF"/>
  <circle class="star2" cx="260" cy="90" r="2" fill="#FFFFFF"/>
  <circle class="star3" cx="680" cy="45" r="2" fill="#FFFFFF"/>
  <circle class="star4" cx="720" cy="85" r="1.5" fill="#FFFFFF"/>

  <!-- Title & Description in Centaur -->
  <text x="450" y="82" class="header-title">serene783</text>
  <text x="450" y="118" class="header-desc">Frontend &amp; Software Developer</text>
</svg>

<svg width="100%" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header-title {
        font-family: 'Centaur', 'EB Garamond', Georgia, serif;
        font-size: 52px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .header-desc {
        font-family: 'Centaur', 'EB Garamond', Georgia, serif;
        font-size: 17px;
        font-weight: 500;
        fill: #8B949E;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="waveGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161C"/>
      <stop offset="50%" stop-color="#090B0E"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <linearGradient id="waveGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2128"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>

  <!-- Animated Background Wave Layer (SMIL translate) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="14s" repeatCount="indefinite"/>
    <path d="M0 0 H1800 V125 Q1687.5 155 1575 130 Q1462.5 105 1350 130 Q1237.5 155 1125 130 Q1012.5 105 900 130 Q787.5 155 675 130 Q562.5 105 450 130 Q337.5 155 225 130 Q112.5 105 0 130 Z" fill="url(#waveGradBack)"/>
    <path d="M0 0 H1800 V125 Q1687.5 155 1575 130 Q1462.5 105 1350 130 Q1237.5 155 1125 130 Q1012.5 105 900 130 Q787.5 155 675 130 Q562.5 105 450 130 Q337.5 155 225 130 Q112.5 105 0 130 Z" stroke="#21262D" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Animated Foreground Wave Layer (SMIL reverse translate) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    <path d="M0 0 H1800 V140 Q1687.5 115 1575 140 Q1462.5 165 1350 140 Q1237.5 115 1125 140 Q1012.5 165 900 140 Q787.5 115 675 140 Q562.5 165 450 140 Q337.5 115 225 140 Q112.5 165 0 140 Z" fill="url(#waveGradFront)" fill-opacity="0.9"/>
    <path d="M0 0 H1800 V140 Q1687.5 115 1575 140 Q1462.5 165 1350 140 Q1237.5 115 1125 140 Q1012.5 165 900 140 Q787.5 115 675 140 Q562.5 165 450 140 Q337.5 115 225 140 Q112.5 165 0 140 Z" stroke="#30363D" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Twinkling Accent Stars (SMIL opacity & scale) -->
  <circle cx="210" cy="50" r="1.5" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.2;2.2;1.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="90" r="2" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2.5;1.5" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="45" r="2" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2.4;1.5" dur="3.2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="85" r="1.5" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.2;2.1;1.2" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Title & Description in Centaur -->
  <text x="450" y="82" class="header-title">
    serene783
    <animate attributeName="opacity" values="0.88;1;0.88" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="118" class="header-desc">Frontend &amp; Software Developer</text>
</svg>

<svg width="680" height="340" viewBox="0 0 680 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 24px; fill: #FFFFFF; }
      .category-label { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 12px; fill: #8B949E; letter-spacing: 1.5px; }
      .chip-text { font-family: 'Centaur', 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 15px; fill: #FFFFFF; }
      .chip-bg { fill: #161B22; stroke: #30363D; stroke-width: 1; transition: 0.2s; }
      .chip-bg:hover { fill: #1C2128; stroke: #8B949E; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="678" height="338" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Scalloped Flower Badge -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(0 18 18)"/>
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(30 18 18)"/>
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#21262D" stroke="#3D444D" stroke-width="1.2" transform="rotate(60 18 18)"/>
    <!-- Code Bracket Icon inside badge -->
    <path d="M14 13l-4 5 4 5-1.4 1.4L7.2 18l5.4-6.4L14 13zm8 0l4 5-4 5 1.4 1.4 5.4-6.4-5.4-6.4L22 13z" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="74" y="46" class="title">Tech stack</text>

  <!-- ================= MAIN SECTION ================= -->
  <text x="26" y="86" class="category-label">MAIN</text>

  <!-- TypeScript Chip -->
  <g transform="translate(24, 98)">
    <rect class="chip-bg" width="124" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#21262D" stroke="#8B949E" stroke-width="1.5"/>
      <text x="4" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">TS</text>
    </g>
    <text x="37" y="22.5" class="chip-text">TypeScript</text>
  </g>

  <!-- Python Chip (Crisp SimpleIcons with evenodd cutout eyes) -->
  <g transform="translate(156, 98)">
    <rect class="chip-bg" width="102" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.912 0C5.975 0 6.35 2.568 6.35 2.568l.006 2.656h5.669v.812H4.075S0 5.56 0 11.517c0 5.957 3.55 5.75 3.55 5.75h2.12v-2.981s-.115-3.55 3.49-3.55h5.487s3.376.054 3.376-3.315V2.568S18.444 0 11.912 0zm-1.74 1.83a1.01 1.01 0 1 1 0 2.02 1.01 1.01 0 0 1 0-2.02zm1.884 22.17c5.937 0 5.562-2.568 5.562-2.568l-.006-2.656h-5.67v-.812h7.95s4.075.477 4.075-5.48c0-5.957-3.55-5.75-3.55-5.75h-2.12v2.981s.115 3.55-3.49 3.55H10.46s-3.376-.054-3.376 3.315v4.873s-.418 2.547 6.114 2.547zm1.74-1.83a1.01 1.01 0 1 1 0-2.02 1.01 1.01 0 0 1 0 2.02z" fill="#FFFFFF"/>
    </g>
    <text x="37" y="22.5" class="chip-text">Python</text>
  </g>

  <!-- C++ Chip -->
  <g transform="translate(266, 98)">
    <rect class="chip-bg" width="86" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M22.394 6.003L13.6.93a3.197 3.197 0 0 0-3.2 0L1.606 6.003A3.2 3.2 0 0 0 0 8.775v10.15a3.2 3.2 0 0 0 1.606 2.772l8.794 5.074a3.197 3.197 0 0 0 3.2 0l8.794-5.074A3.2 3.2 0 0 0 24 18.925V8.775a3.2 3.2 0 0 0-1.606-2.772zm-12.82 9.94a3.943 3.943 0 0 1-3.943-3.943 3.943 3.943 0 0 1 3.943-3.943c1.472 0 2.766.814 3.447 2.012l-1.854 1.07a1.8 1.8 0 0 0-1.593-.942 1.8 1.8 0 0 0-1.8 1.8 1.8 1.8 0 0 0 1.8 1.8c.67 0 1.26-.37 1.56-.918l1.866 1.05a3.927 3.927 0 0 1-3.426 1.91zm5.226-2.743h1.2v-1.2h.8v1.2h1.2v.8h-1.2v1.2h-.8v-1.2h-1.2v-.8zm4 0h1.2v-1.2h.8v1.2h1.2v.8h-1.2v1.2h-.8v-1.2h-1.2v-.8z" fill="#FFFFFF"/>
    </g>
    <text x="37" y="22.5" class="chip-text">C++</text>
  </g>

  <!-- Rust Chip (Gear silhouette with iconic R) -->
  <g transform="translate(360, 98)">
    <rect class="chip-bg" width="86" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <!-- Outer gear teeth circle -->
      <circle cx="12" cy="12" r="9.5" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="3.2 1.8" fill="none"/>
      <!-- Inner ring -->
      <circle cx="12" cy="12" r="7.2" stroke="#FFFFFF" stroke-width="1.2" fill="#21262D"/>
      <!-- Bold R -->
      <text x="7.8" y="16.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">R</text>
    </g>
    <text x="37" y="22.5" class="chip-text">Rust</text>
  </g>

  <!-- Java Chip (Clean steaming coffee cup & saucer) -->
  <g transform="translate(454, 98)">
    <rect class="chip-bg" width="86" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <!-- Steam lines -->
      <path d="M8.5 7c-.6-1.3-.6-2.5 0-3.6M11.5 7c-.6-1.3-.6-2.5 0-3.6M14.5 7c-.6-1.3-.6-2.5 0-3.6" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- Cup Body -->
      <path d="M6 9.5h9v5c0 2.5-2 4-4.5 4s-4.5-1.5-4.5-4v-5z" fill="#FFFFFF"/>
      <!-- Cup Handle -->
      <path d="M15 11h1.5a1.8 1.8 0 0 1 1.8 1.8v.4a1.8 1.8 0 0 1-1.8 1.8H15v-1.2h1.5a.6.6 0 0 0 .6-.6v-.4a.6.6 0 0 0-.6-.6H15V11z" fill="#FFFFFF"/>
      <!-- Saucer -->
      <path d="M4 19.5c0 .6 3.6 1.2 7.5 1.2s7.5-.6 7.5-1.2c0-.6-3.6-1.2-7.5-1.2s-7.5.6-7.5 1.2z" fill="#FFFFFF"/>
    </g>
    <text x="37" y="22.5" class="chip-text">Java</text>
  </g>

  <!-- ================= ALSO SECTION ================= -->
  <text x="26" y="168" class="category-label">ALSO</text>

  <!-- JavaScript Chip -->
  <g transform="translate(24, 180)">
    <rect class="chip-bg" width="118" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#21262D" stroke="#8B949E" stroke-width="1.5"/>
      <text x="5" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">JS</text>
    </g>
    <text x="37" y="22.5" class="chip-text">JavaScript</text>
  </g>

  <!-- C# Chip -->
  <g transform="translate(152, 180)">
    <rect class="chip-bg" width="80" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" stroke="#FFFFFF" stroke-width="1.5" fill="#21262D"/>
      <text x="5.5" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">C#</text>
    </g>
    <text x="37" y="22.5" class="chip-text">C#</text>
  </g>

  <!-- ================= TOOLS SECTION ================= -->
  <text x="26" y="250" class="category-label">TOOLS</text>

  <!-- Git Chip (Rounded Diamond with Branch & 3 Nodes) -->
  <g transform="translate(24, 262)">
    <rect class="chip-bg" width="80" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <g transform="translate(12, 12)">
        <rect x="-8.5" y="-8.5" width="17" height="17" rx="3.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" transform="rotate(45)"/>
        <line x1="-2" y1="-5" x2="-2" y2="5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M-2 1c1.5 0 4-1 4-3" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <circle cx="-2" cy="-4.5" r="1.5" fill="#FFFFFF"/>
        <circle cx="-2" cy="4.5" r="1.5" fill="#FFFFFF"/>
        <circle cx="2" cy="-2.5" r="1.5" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="37" y="22.5" class="chip-text">Git</text>
  </g>

  <!-- Figma Chip (5 Distinct Crisp Geometric Shapes) -->
  <g transform="translate(112, 262)">
    <rect class="chip-bg" width="94" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <!-- Top Left -->
      <path d="M6 3h3v5H6a2.5 2.5 0 0 1 0-5z" fill="#FFFFFF"/>
      <!-- Top Right -->
      <path d="M9 3h3a2.5 2.5 0 0 1 0 5H9V3z" fill="#FFFFFF"/>
      <!-- Middle Left -->
      <path d="M6 8h3v5H6a2.5 2.5 0 0 1 0-5z" fill="#FFFFFF"/>
      <!-- Middle Right -->
      <circle cx="11.5" cy="10.5" r="2.5" fill="#FFFFFF"/>
      <!-- Bottom Left -->
      <path d="M6 13h3v2.5a2.5 2.5 0 0 1-5 0V13z" fill="#FFFFFF"/>
    </g>
    <text x="37" y="22.5" class="chip-text">Figma</text>
  </g>

  <!-- Docker Chip (Whale + Container Blocks Grid) -->
  <g transform="translate(214, 262)">
    <rect class="chip-bg" width="102" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <!-- Containers Grid with crisp gaps -->
      <g fill="#FFFFFF">
        <rect x="8" y="5" width="2.4" height="2" rx="0.3"/>
        <rect x="5.2" y="7.5" width="2.4" height="2" rx="0.3"/>
        <rect x="8" y="7.5" width="2.4" height="2" rx="0.3"/>
        <rect x="10.8" y="7.5" width="2.4" height="2" rx="0.3"/>
        <rect x="2.4" y="10" width="2.4" height="2" rx="0.3"/>
        <rect x="5.2" y="10" width="2.4" height="2" rx="0.3"/>
        <rect x="8" y="10" width="2.4" height="2" rx="0.3"/>
        <rect x="10.8" y="10" width="2.4" height="2" rx="0.3"/>
        <rect x="13.6" y="10" width="2.4" height="2" rx="0.3"/>
        <!-- Whale Body -->
        <path d="M22.5 11.2c-.3-.2-1.4-.2-2.1.4-.4-.8-1.2-1.3-2.1-1.3h-.5c-.3 0-.5.2-.5.5v3.8c0 1.2-.9 2.2-2.1 2.4-1.5.2-4.8.2-6.2-.2-1-.3-1.6-1.2-1.6-2.2v-2.1c0-.3-.2-.5-.5-.5H1.8c-.3 0-.5.2-.5.5 0 2.2.4 4.5 2.2 6.1 2 1.8 5 2.4 8 2.4 5.2 0 9.8-2.6 11-7.5.3-1.2.2-1.8 0-2.3zm-3.3 3.6c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7z"/>
      </g>
    </g>
    <text x="37" y="22.5" class="chip-text">Docker</text>
  </g>

  <!-- Flutter Chip -->
  <g transform="translate(324, 262)">
    <rect class="chip-bg" width="98" height="36" rx="12"/>
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.37zm.014 11.072L7.857 17.53l6.47 6.47H21.7l-6.46-6.468 6.46-6.46h-7.372z" fill="#FFFFFF"/>
    </g>
    <text x="37" y="22.5" class="chip-text">Flutter</text>
  </g>

</svg>
